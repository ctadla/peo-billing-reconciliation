<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gus in Slack – Benefits renewal prototype</title>
<style>
  :root {
    --aubergine: #3f0e40;
    --aubergine-dark: #350d36;
    --active: #1164a3;
    --green: #2f7d5b;
    --green-dark: #256a4c;
    --green-bg: #e9f4ef;
    --amber: #e0a030;
    --ink: #1d1c1d;
    --muted: #616061;
    --line: #e3e3e3;
    --card: #f8f8f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Lato, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); font-size: 15px; line-height: 1.45; }
  .app { display: flex; height: 100vh; }

  /* Sidebar */
  .sidebar { width: 260px; background: var(--aubergine); color: #d8c7d8; display: flex; flex-direction: column; padding: 12px 8px; flex-shrink: 0; }
  .ws { padding: 4px 8px 12px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 12px; }
  .ws b { color: #fff; font-size: 17px; display: block; }
  .ws span { font-size: 12px; }
  .ws span::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #3fb27f; border-radius: 50%; margin-right: 5px; }
  .sec { font-size: 13px; padding: 10px 8px 4px; color: #cdb8cd; }
  .item { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  .item:hover { background: rgba(255,255,255,.08); }
  .item.active { background: var(--active); color: #fff; font-weight: 700; }
  .item .dot { width: 9px; height: 9px; border-radius: 50%; background: #3fb27f; }
  .item .dot.off { background: transparent; border: 1px solid #a98ea9; }
  .badge { margin-left: auto; background: #e01e5a; color: #fff; font-size: 12px; font-weight: 700; border-radius: 9px; padding: 0 6px; }
  .item.new { animation: pop .5s ease; }
  @keyframes pop { from { background: rgba(255,255,255,.35); } to { background: transparent; } }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
  .header { height: 49px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 20px; font-weight: 800; font-size: 16px; flex-shrink: 0; }
  .header .sub { font-weight: 400; color: var(--muted); font-size: 13px; }
  .stream { flex: 1; overflow-y: auto; padding: 16px 20px 12px; }
  .stream-inner { max-width: 760px; }
  .msg { display: flex; gap: 10px; margin-bottom: 18px; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .av { width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; }
  .av.gus { background: #ee5a3c; }
  .av.me { background: #5b6b8c; }
  .av.sc { background: #4a154b; }
  .av.e1 { background: #2a8f8f; } .av.e2 { background: #a0522d; } .av.e3 { background: #6b5b95; } .av.e4 { background: #3a7d44; } .av.e5 { background: #b5651d; }
  .body { min-width: 0; flex: 1; }
  .who { font-weight: 800; }
  .who small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .body p { margin: 4px 0 10px; }
  .body h4 { margin: 12px 0 2px; font-size: 15px; }

  .btns { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
  button.btn { font: inherit; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 5px; cursor: pointer; border: 1px solid #b8b8b8; background: #fff; color: var(--ink); }
  button.btn:hover { background: #f4f4f4; }
  button.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.btn.primary:hover { background: var(--green-dark); }
  button.btn[disabled] { opacity: .5; cursor: default; }

  .callout { border-left: 4px solid var(--green); background: var(--card); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 10px 0; }
  .callout.amber { border-left-color: var(--amber); }
  .note { font-style: italic; color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .savings { background: var(--green-bg); border-radius: 10px; padding: 14px 16px; margin: 10px 0 14px; }
  .savings b.big { font-size: 18px; display: block; margin-bottom: 4px; }

  table.cmp { width: 100%; border-collapse: collapse; background: #fafafa; }
  table.cmp th { text-align: right; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: #efefef; padding: 10px 12px; }
  table.cmp th:first-child { text-align: left; }
  table.cmp td { padding: 10px 12px; border-top: 1px solid var(--line); text-align: right; }
  table.cmp td:first-child { text-align: left; font-weight: 700; }
  table.cmp tr.total td { font-weight: 800; border-top: 2px solid var(--line); }
  .up { color: #b3402a; font-weight: 700; }
  .down { color: var(--green); font-weight: 800; }

  .cards { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
  .plan { flex: 1; min-width: 170px; border: 1px solid #cfcfcf; border-radius: 10px; padding: 14px; background: #fff; cursor: default; }
  .plan.rec { border: 2px solid var(--green); }
  .plan.sel { box-shadow: 0 0 0 3px rgba(47,125,91,.25); }
  .plan h5 { margin: 0 0 8px; font-size: 14px; line-height: 1.25; }
  .plan .price { font-size: 22px; font-weight: 800; }
  .plan .price small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .plan .strike { text-decoration: line-through; color: var(--muted); font-size: 13px; }
  .plan .det { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .plan .tag { color: var(--green); font-weight: 700; font-size: 13px; margin-top: 8px; }
  .plan .tag.warn { color: #b3402a; }

  .steps { margin: 8px 0; padding: 0; list-style: none; }
  .steps li { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; }
  .steps .ck { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .steps .ck.done { background: var(--green); color: #fff; }
  .steps .ck.now { background: var(--amber); color: #fff; }
  .bar { height: 12px; background: #e6e6e6; border-radius: 6px; overflow: hidden; display: flex; margin: 6px 0 4px; }
  .bar i { display: block; height: 100%; }
  .legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); }
  table.emp { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
  table.emp th { text-align: left; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.emp td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
  .pill.done { background: var(--green-bg); color: var(--green-dark); }
  .pill.prog { background: #fdf1d9; color: #8a5a00; }
  .pill.none { background: #fbe4df; color: #a6371f; }

  .sys { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 16px; }
  .mention { background: #e8f5fa; color: #1264a3; border-radius: 3px; padding: 0 2px; }
  .typing { color: var(--muted); font-size: 13px; margin: -8px 0 14px 46px; }

  /* Composer */
  .composer { padding: 0 20px 16px; flex-shrink: 0; }
  .composer .box { border: 1px solid #9a9a9a; border-radius: 8px; display: flex; align-items: center; padding: 6px 8px 6px 12px; max-width: 100%; }
  .composer input { flex: 1; border: 0; outline: 0; font: inherit; padding: 6px 0; background: transparent; }
  .composer .send { border: 0; background: var(--green); color: #fff; font-weight: 700; border-radius: 5px; padding: 6px 12px; cursor: pointer; }
  .composer .send:disabled { background: #c9c9c9; cursor: default; }
  .chip { margin: 0 0 8px; }
  .chip button { font: inherit; font-size: 13px; background: #f4ede4; border: 1px dashed #c9a66b; color: #6b4a14; border-radius: 14px; padding: 3px 12px; cursor: pointer; }
  .chip button:hover { background: #efe3d1; }
  .btn.mini { padding: 1px 9px; font-size: 12px; }
  .reset { position: fixed; right: 14px; top: 12px; font-size: 12px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; z-index: 5; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="main">
    <div class="header" id="header"></div>
    <div class="stream" id="stream"><div class="stream-inner" id="inner"></div></div>
    <div class="composer">
      <div class="chip" id="chip"></div>
      <form class="box" id="form" autocomplete="off">
        <input id="input" placeholder="Message Gus">
        <button class="send" id="send" type="submit" disabled>Send</button>
      </form>
    </div>
  </section>
</div>
<button class="reset" id="reset">Reset demo</button>

<script>
/* ---------- Synthetic demo data (no real customer data) ---------- */
// Persona defaults are synthetic. Override at view time with URL params, e.g.
//   index.html?company=Acme%20Inc&admin=Pat&full=Pat%20Lee
// so real customer names never need to be committed.
const Q = new URLSearchParams(location.search);
const adminFirst = Q.get("admin") || "Jessica";
const adminFull = Q.get("full") || (Q.get("admin") ? adminFirst : "Jessica Jackson");
const ADMIN = { first: adminFirst, full: adminFull, initials: adminFull.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase() };
const COMPANY = Q.get("company") || "Lone Star Systems";
const SLUG = COMPANY.toLowerCase().replace(/\b(inc|llc|ltd|corp)\b\.?/g, "").trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const CHANNELS = ["announcements", "team-updates", "number-go-up", `pets-of-${SLUG}`];
const EMPLOYEES = 10;
const CONFIRM_BY = "9/30";
const CURRENT_MO = 4600;                       // current UHC monthly premium
const RENEWAL_MO = Math.round(CURRENT_MO * 1.28);   // +28%
const ALT_MO = Math.round(RENEWAL_MO * 0.85);       // advisor package, 15% below renewal
const SAVE_MO = RENEWAL_MO - ALT_MO;
const SAVE_YR = SAVE_MO * 12;
const OE = { start: "10/1", end: "10/15", effective: "1/1" };
const STAFF = [
  { name: "Jordan Mills",  s: "done", c: "e1" }, { name: "Priya Sharma", s: "done", c: "e2" },
  { name: "Tom Rivera",    s: "done", c: "e3" }, { name: "Alex Nguyen",  s: "done", c: "e4" },
  { name: "Maria Lopez",   s: "done", c: "e5" }, { name: "Sam Okafor",   s: "prog", c: "e1" },
  { name: "Dana Whitfield",s: "prog", c: "e2" }, { name: "Chris Bell",   s: "none", c: "e3" },
  { name: "Leah Park",     s: "none", c: "e4" }, { name: "Marcus Reed",  s: "none", c: "e5" },
];
const $ = (n) => "$" + n.toLocaleString();

/* ---------- State ---------- */
let S;
function fresh() { return { view: "dm", dm: [], group: null, step: 0, chosen: null, udm: {}, nudged: {} }; }
S = fresh();

const el = (id) => document.getElementById(id);
const inner = el("inner");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- Rendering helpers ---------- */
function sidebar() {
  el("sidebar").innerHTML = `
    <div class="ws"><b>${COMPANY}</b><span>${ADMIN.full}</span></div>
    <div class="sec">Channels</div>
    ${CHANNELS.map((c) => `<div class="item ${S.view === "ch:" + c ? "active" : ""}" data-v="ch:${c}"># ${c}</div>`).join("")}
    <div class="sec">Direct messages</div>
    <div class="item ${S.view === "dm" ? "active" : ""}" data-v="dm"><span class="dot"></span>Gus${S.unread ? `<span class="badge">${S.unread}</span>` : ""}</div>
    ${S.group ? `<div class="item new ${S.view === "group" ? "active" : ""}" data-v="group"><span class="dot off"></span>Gus, ${S.group.names.slice(0,2).map(n=>n.split(" ")[0]).join(", ")} +${S.group.names.length-2}</div>` : ""}
    ${Object.keys(S.udm).map((n) => `<div class="item new ${S.view === "u:" + n ? "active" : ""}" data-v="u:${n}"><span class="dot off"></span>${n}${S.udm[n].unread ? `<span class="badge">${S.udm[n].unread}</span>` : ""}</div>`).join("")}
    <div class="item"><span class="dot off"></span>Tom Rivera</div>
    <div class="item"><span class="dot off"></span>Priya Sharma</div>`;
  document.querySelectorAll(".item[data-v]").forEach((n) => n.onclick = () => { S.view = n.dataset.v; S.unread = 0; if (S.view.startsWith("u:")) S.udm[S.view.slice(2)].unread = 0; renderAll(); });
}
function header() {
  el("header").innerHTML = S.view.startsWith("ch:") ? `# ${S.view.slice(3)}`
    : S.view.startsWith("u:") ? `${S.view.slice(2)} <span class="sub">· ZEROEX teammate</span>`
    : S.view === "dm"
    ? `Gus <span style="color:#3fb27f">●</span>`
    : `${S.group.names.length + 2} people <span class="sub">· Gus, ${ADMIN.first}, ${S.group.names.length} teammates</span>`;
}
function msgHtml(m, i) {
  if (m.render) m = { ...m, html: m.render() };
  if (m.sys) return `<div class="sys">${m.sys}</div>`;
  const av = m.from === "gus" ? `<div class="av gus">G</div>` : m.from === "me" ? `<div class="av me">${ADMIN.initials}</div>` : `<div class="av ${m.c || "sc"}">${m.init || "?"}</div>`;
  const nm = m.from === "gus" ? "Gus" : m.from === "me" ? ADMIN.full : m.name;
  return `<div class="msg" data-i="${i}"><div>${av}</div><div class="body"><div class="who">${nm}<small>${m.t || ""}</small></div>${m.html}</div></div>`;
}
const P = (name, init, c, t, text) => ({ from: "emp", name, init, c, t, html: `<p>${text}</p>` });
function channelMsgs(ch) {
  const pet = `pets-of-${SLUG}`;
  const M = {
    "announcements": [
      P("Tom Rivera", "TR", "e3", "9:02 AM", "📣 Reminder: the office wifi password is <b>not</b> a seed phrase. Please stop writing it on the whiteboard."),
      P("Priya Sharma", "PS", "e2", "9:40 AM", "Quarterly all-hands is Thursday. Agenda: roadmap, benefits open enrollment (10/1–10/15), and why the snack budget is denominated in ETH."),
    ],
    "team-updates": [
      P("Alex Nguyen", "AN", "e4", "Mon", "Shipped the API rate-limit fix. Latency is down 40%. Nobody tell the on-call pager, it's been quiet and I'm scared."),
      P("Maria Lopez", "ML", "e5", "Tue", "PSA: \"it works on my testnet\" is not a release criterion."),
    ],
    "number-go-up": [
      P("Marcus Reed", "MR", "e5", "8:12 AM", "gm 🌅"),
      P("Chris Bell", "CB", "e3", "8:13 AM", "gm. chart is green. I will be insufferable until further notice."),
      P("Leah Park", "LP", "e4", "8:20 AM", "Reminder that none of this is financial advice, and also that my cat is now a validator."),
      P("Marcus Reed", "MR", "e5", "8:21 AM", "ngmi if you check the price more than 3 times before lunch. I'm at 11. See you all at the top 🚀"),
    ],
  };
  M[pet] = [
    P("Sam Okafor", "SO", "e1", "12:30 PM", "Meet <b>Satoshi</b>, my golden retriever. He has never once sold the dip (he can't reach the keyboard). 🐕"),
    P("Dana Whitfield", "DW", "e2", "12:34 PM", "Our rescue cat <b>Vitalik</b> has been sitting on my laptop for 3 hours. Technically that's proof of work."),
    P("Jordan Mills", "JM", "e1", "12:41 PM", "Update: Satoshi ate a hardware wallet. Recovery is, uh, ongoing. Please stand by. 🙏"),
  ];
  return M[ch] || [];
}
function renderAll() {
  sidebar(); header();
  const list = S.view.startsWith("ch:") ? channelMsgs(S.view.slice(3)) : S.view.startsWith("u:") ? S.udm[S.view.slice(2)].msgs : S.view === "dm" ? S.dm : S.group.msgs;
  inner.innerHTML = list.map(msgHtml).join("");
  list.forEach((m, i) => { if (m.done) inner.querySelectorAll(`.msg[data-i="${i}"] button`).forEach((b) => (b.disabled = true)); });
  wire();
  el("stream").scrollTop = el("stream").scrollHeight;
  chip();
}
function push(list, m) { list.push(m); renderAll(); }
async function gus(html, t, delay = 700) {
  const typing = document.createElement("div"); typing.className = "typing"; typing.id = "typing"; typing.textContent = "Gus is typing…";
  inner.appendChild(typing); el("stream").scrollTop = el("stream").scrollHeight;
  await sleep(delay); typing.remove();
  push(S.dm, { from: "gus", t, html });
}

/* ---------- Message content ---------- */
const planCards = (sel) => `
  <div class="cards">
    <div class="plan ${sel === "keep" ? "sel" : ""}">
      <h5>UHC Choice Plus PPO (current, renewing)</h5>
      <div class="price">~${$(Math.round(RENEWAL_MO / EMPLOYEES))}<small>/employee/mo</small></div>
      <div class="strike">now ~${$(Math.round(CURRENT_MO / EMPLOYEES))}</div>
      <div class="det">Deductible: $1,500 individual<br>OOP max: $6,000</div>
      <div class="tag warn">▲ 28% renewal increase</div>
    </div>
    <div class="plan rec ${sel === "bcbs" ? "sel" : ""}">
      <h5>Blue Cross Blue Shield TX — Standard PPO</h5>
      <div class="price">~${$(Math.round(ALT_MO / EMPLOYEES))}<small>/employee/mo</small></div>
      <div class="det">Deductible: $1,000 individual<br>OOP max: $4,500</div>
      <div class="tag">✅ 15% below your renewal · Better deductible</div>
    </div>
    <div class="plan rec">
      <h5>Blue Cross Blue Shield TX — Premium PPO</h5>
      <div class="price">~${$(Math.round(ALT_MO * 1.06 / EMPLOYEES))}<small>/employee/mo</small></div>
      <div class="det">Deductible: $500 individual<br>OOP max: $3,000</div>
      <div class="tag">✅ Richer coverage · Still below renewal</div>
    </div>
  </div>`;

const openingMsg = () => `
  <p>Hey ${ADMIN.first} 👋 Yes, one thing: your <b>health plan renewal notice</b> just came in.</p>
  <div class="callout amber"><b>📋 Health plans renew ${OE.effective}/27</b><br>Your carrier (UHC) is renewing ${COMPANY}'s plans with a <b>28% rate increase</b>. Plans need to be confirmed by <b>${CONFIRM_BY}</b> so open enrollment can start on ${OE.start}.</div>
  <p>I also found an alternative from our benefits advisors that could save you money. Mind if I walk you through it?</p>
  <div class="btns"><button class="btn primary" data-act="show">Show me</button><button class="btn" data-act="later">Not right now</button></div>`;

const compareMsg = () => `
  <p>Here's what your renewal looks like for ${COMPANY} (${EMPLOYEES} enrolled employees):</p>
  <div class="callout"><table class="cmp">
    <tr><th></th><th>Renewing as-is<br>(UHC)</th><th>Advisor package<br>(BCBS TX)</th></tr>
    <tr><td>Monthly premium</td><td>${$(RENEWAL_MO)}/mo</td><td>${$(ALT_MO)}/mo</td></tr>
    <tr><td>Change vs. today (${$(CURRENT_MO)}/mo)</td><td class="up">+28%</td><td class="up">+${Math.round((ALT_MO / CURRENT_MO - 1) * 100)}%</td></tr>
    <tr class="total"><td>Change vs. renewal</td><td>—</td><td class="down">−15%</td></tr>
  </table></div>
  <div class="note">Rates shown are illustrative. Carrier rates are held until the plan confirmation deadline.</div>
  <div class="savings"><b class="big">💰 You'd save ${$(SAVE_MO)}/mo — that's ${$(SAVE_YR)}/year.</b>
    Good news: our benefits advisors put together an alternate package with Blue Cross Blue Shield of Texas. It covers the same network type with a lower premium and a better deductible than your renewing UHC plan.</div>
  ${planCards(S.chosen)}
  <div class="btns">
    <button class="btn primary" data-act="bcbs">Switch to BCBS TX</button>
    <button class="btn" data-act="keep">Confirm my plans as-is</button>
    <button class="btn" data-act="advisor">Talk to an advisor first</button>
  </div>`;

const confirmedMsg = (choice) => `
  <p>${choice === "bcbs"
      ? `✅ Done — I've confirmed the <b>BCBS TX Standard PPO</b> package for ${OE.effective}/27. You're saving <b>${$(SAVE_YR)}/yr</b> versus the renewal.`
      : `✅ Done — I've confirmed your current <b>UHC Choice Plus</b> plans for ${OE.effective}/27 at the renewal rate of ${$(RENEWAL_MO)}/mo.`}</p>
  <div class="callout"><b>Next up: open enrollment</b><br>Your team's open enrollment window runs <b>${OE.start} – ${OE.end}</b>. I'll track who's finished and let you know if anyone needs a nudge.</div>`;

const statusMsg = () => {
  const c = STAFF.filter((e) => e.s === "done"), p = STAFF.filter((e) => e.s === "prog"), n = STAFF.filter((e) => e.s === "none");
  const pill = { done: `<span class="pill done">Completed</span>`, prog: `<span class="pill prog">In progress</span>`, none: `<span class="pill none">Not started</span>` };
  const choice = S.chosen === "keep" ? "your current UHC plans" : "the BCBS TX Standard PPO package";
  return `
  <p>Hey ${ADMIN.first}! No worries — here's where you're at with your ${OE.effective}/27 renewal:</p>
  <ul class="steps">
    <li><span class="ck done">✓</span><div><b>1. Plans confirmed</b> — you confirmed ${choice}.</div></li>
    <li><span class="ck now">2</span><div><b>2. Open enrollment is live</b> — it runs ${OE.start} – ${OE.end} (<b>9 days left</b>).</div></li>
    <li><span class="ck now">3</span><div><b>3. ${c.length} of ${EMPLOYEES} employees have completed OE</b></div></li>
  </ul>
  <div class="bar"><i style="width:${c.length * 10}%;background:var(--green)"></i><i style="width:${p.length * 10}%;background:var(--amber)"></i><i style="width:${n.length * 10}%;background:#d9645a"></i></div>
  <div class="legend"><span style="--c:var(--green)">${c.length} completed</span><span style="--c:var(--amber)">${p.length} in progress</span><span style="--c:#d9645a">${n.length} not started</span></div>
  <table class="emp"><tr><th>Employee</th><th>Status</th><th></th></tr>
    ${[...n, ...p, ...c].map((e) => `<tr><td>${e.name}</td><td>${pill[e.s]}</td><td style="text-align:right">${e.s === "done" ? "" : S.nudged[e.name] ? `<span class="pill done">Nudged ✓</span>` : `<button class="btn mini" data-act="nudge1:${e.name}">Nudge</button>`}</td></tr>`).join("")}
  </table>
  <p>${p.length + n.length} people still need to finish. Do you want me to nudge them to complete OE? You can nudge everyone at once, or use the <b>Nudge</b> buttons above to pick individuals.</p>
  <div class="btns"><button class="btn primary" data-act="nudge">Yes, nudge everyone</button><button class="btn" data-act="nonudge">Not yet</button></div>`;
};

/* ---------- Actions ---------- */
async function act(a, btn) {
  S.unread = 0;
  if (a.startsWith("nudge1:")) return nudgeOne(a.slice(7));
  const mi = btn.closest(".msg").dataset.i;
  if (S.view === "dm") S.dm[mi].done = true;
  btn.parentElement.querySelectorAll("button").forEach((b) => (b.disabled = true));
  if (a === "show") {
    push(S.dm, { from: "me", t: now(), html: `<p>Show me</p>` });
    await gus(`<h4>Quick context</h4><p>Your current UHC plans renew on <b>${OE.effective}/27</b> with a <b>28% rate increase</b>. Before you confirm, I compared them against what our advisors can offer.</p>`, now());
    await gus(compareMsg(), now(), 900);
  } else if (a === "later") {
    push(S.dm, { from: "me", t: now(), html: `<p>Not right now</p>` });
    await gus(`<p>No problem — I'll remind you before the ${CONFIRM_BY} confirmation deadline. Just message me any time.</p>`, now());
  } else if (a === "bcbs" || a === "keep") {
    S.chosen = a;
    push(S.dm, { from: "me", t: now(), html: `<p>${a === "bcbs" ? "Switch to BCBS TX" : "Confirm my plans as-is"}</p>` });
    await gus(confirmedMsg(a), now());
    S.step = 1;
    S.dm.push({ sys: "— A few days later (Oct 6) —" }); renderAll();
    chip();
  } else if (a === "advisor") {
    push(S.dm, { from: "me", t: now(), html: `<p>Talk to an advisor first</p>` });
    await gus(`<p>Of course — I've flagged a benefits advisor, who'll reach out within one business day. Come back when you're ready to confirm.</p>`, now());
  } else if (a === "nudge") {
    push(S.dm, { from: "me", t: now(), html: `<p>Yes, nudge everyone</p>` });
    const todo = STAFF.filter((e) => e.s !== "done" && !S.nudged[e.name]);
    if (!todo.length) { await gus(`<p>Everyone who's behind has already been nudged. 🙌 I'll let you know when they finish.</p>`, now()); return; }
    todo.forEach((e) => (S.nudged[e.name] = true));
    await gus(`<p>On it. I'm opening a group chat with the ${todo.length} ${todo.length === STAFF.filter((e) => e.s !== "done").length ? "people who haven't finished" : "remaining people"}, and I'll send a friendly reminder from you. 👇</p>`, now());
    await sleep(400);
    S.group = { names: todo.map((e) => e.name), msgs: [] };
    S.unread = 0;
    S.group.msgs.push({ sys: `Gus created this group and added ${ADMIN.first} and ${todo.length} teammates` });
    S.group.msgs.push({ from: "me", t: now(), html: `<p>${todo.map((e) => `<span class="mention">@${e.name.split(" ")[0]}</span>`).join(" ")} — quick reminder that open enrollment closes <b>${OE.end}</b>. It takes about 10 minutes in Gusto. Let me know if you have questions! — ${ADMIN.first}</p><div class="btns"><button class="btn primary" disabled>Complete enrollment in Gusto</button></div>`, sent: "via Gus" });
    S.group.msgs.push({ sys: "Sent on your behalf by Gus" });
    S.view = "group";
    renderAll();
    await sleep(1600);
    const r = todo.find((e) => e.s === "prog") || todo[0];
    S.group.msgs.push({ from: "emp", name: r.name, init: r.name.split(" ").map((x) => x[0]).join(""), c: r.c, t: now(), html: `<p>Thanks for the nudge — finishing mine this afternoon 👍</p>` });
    renderAll();
  } else if (a === "nonudge") {
    push(S.dm, { from: "me", t: now(), html: `<p>Not yet</p>` });
    await gus(`<p>Got it. I'll check again on ${OE.end.replace("15", "13")} and let you know who's still outstanding.</p>`, now());
  }
}
const now = () => { const d = new Date(); return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };

async function nudgeOne(name) {
  if (S.nudged[name]) return;
  const e = STAFF.find((x) => x.name === name);
  S.nudged[name] = true;
  const first = name.split(" ")[0];
  const init = name.split(" ").map((x) => x[0]).join("");
  S.udm[name] = { unread: 0, msgs: [
    { sys: `Gus sent this on your behalf` },
    { from: "me", t: now(), html: `<p>Hi ${first} — quick reminder that open enrollment closes <b>${OE.end}</b>. It takes about 10 minutes in Gusto. Let me know if you have questions! — ${ADMIN.first}</p><div class="btns"><button class="btn primary" disabled>Complete enrollment in Gusto</button></div>` },
  ] };
  renderAll();
  await gus(`<p>✅ Nudged <b>${name}</b> — you can see it in your DM with ${first}.</p>`, now(), 500);
  await sleep(1400);
  const reply = e.s === "prog" ? `Thanks — I'm halfway through, finishing today 👍` : `Ugh, totally forgot. On it right now 🙏`;
  S.udm[name].msgs.push({ from: "emp", name, init, c: e.c, t: now(), html: `<p>${reply}</p>` });
  if (S.view !== "u:" + name) S.udm[name].unread = 1;
  renderAll();
}

/* ---------- Free-text (second interaction) ---------- */
async function userSays(text) {
  if (S.view !== "dm") return;
  push(S.dm, { from: "me", t: now(), html: `<p>${text.replace(/</g, "&lt;")}</p>` });
  // After plans are confirmed, any message is treated as "where am I at?"
  if (S.chosen || /renewal|where|status|enroll|oe\b|busy|catch/i.test(text)) {
    if (!S.chosen) { S.chosen = "bcbs"; }
    const idx = S.dm.length;
    await gus("", now(), 1000);
    S.dm[S.dm.length - 1].render = statusMsg;
    renderAll();
  } else {
    await gus(`<p>I can help with your benefits renewal — try asking where you're at with it.</p>`, now());
  }
}
const SUGGEST = "hey - life has been busy. Can you tell me where I'm at with my renewal?";
function chip() {
  el("chip").innerHTML = S.view === "dm" && S.step === 1 ? `<button type="button" id="sug">💬 Try: “${SUGGEST}”</button>` : "";
  const sug = document.getElementById("sug");
  if (sug) sug.onclick = () => { el("input").value = SUGGEST; el("send").disabled = false; el("input").focus(); };
}
el("input").oninput = (e) => (el("send").disabled = !e.target.value.trim());
el("form").onsubmit = (e) => { e.preventDefault(); const v = el("input").value.trim(); if (!v) return; el("input").value = ""; el("send").disabled = true; S.step = 2; userSays(v); };
function wire() { inner.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => act(b.dataset.act, b))); }
el("reset").onclick = () => { S = fresh(); inner.innerHTML = ""; boot(); };

let bootId = 0;
async function boot() {
  const id = ++bootId;
  S.unread = 0;
  push(S.dm, { from: "me", t: "10:14 AM", html: `<p>Hey Gus, catch me up - anything I need to do related to benefits?</p>` });
  await gus(openingMsg(), "10:14 AM", 1100);
  if (id !== bootId) return;
}
boot();
</script>
</body>
